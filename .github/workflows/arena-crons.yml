# Hobby Vercel only allows daily crons. This workflow hits settle/fees every 15m.
# Required repo secrets: ARENA_URL (https://your-app.vercel.app), CRON_SECRET
name: Arena crons

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  fees-and-settle:
    runs-on: ubuntu-latest
    steps:
      - name: Fee indexer
        env:
          ARENA_URL: ${{ secrets.ARENA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ARENA_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: set ARENA_URL and CRON_SECRET repository secrets"
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "${ARENA_URL%/}/api/cron/fees"

      - name: Settle
        env:
          ARENA_URL: ${{ secrets.ARENA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ARENA_URL" ] || [ -z "$CRON_SECRET" ]; then
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "${ARENA_URL%/}/api/cron/settle"
